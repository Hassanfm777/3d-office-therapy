<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Therapy</title>
    <style>
        :root {
            --primary: #2c5e7b;
            --primary-dark: #1a3a4c;
            --bg-color: #f0f4f8;
            --box-bg: #ffffff;
            --highlight: #27ae60;
            --highlight-dark: #1e8449;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            color: #333;
            margin: 0;
            min-height: 100vh;
        }

        .top-bar { width: 100%; max-width: 600px; display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .lang-btn { 
            background: var(--box-bg); border: 2px solid var(--primary); color: var(--primary); 
            padding: 8px 25px; border-radius: 20px; cursor: pointer; font-weight: bold; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.2s;
        }
        .lang-btn:hover { background: var(--primary); color: white; }

        .app-container { 
            background: var(--box-bg); padding: 40px 30px; border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 600px; width: 100%;
            box-sizing: border-box; text-align: center;
        }

        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h1 { color: var(--primary); font-size: 28px; margin-top: 0; }
        
        .name-input {
            width: 100%; padding: 15px; font-size: 18px; border: 2px solid #dfe6e9;
            border-radius: 12px; box-sizing: border-box; margin: 20px 0; text-align: center;
            outline: none; transition: 0.2s;
        }
        .name-input:focus { border-color: var(--primary); }

        .submit-name-btn {
            background: var(--primary); color: white; border: none; padding: 15px;
            font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer;
            width: 100%; box-shadow: 0 4px 0 var(--primary-dark); transition: 0.1s;
        }
        .submit-name-btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--primary-dark); }

        .category-grid { display: flex; flex-direction: column; gap: 25px; margin-top: 25px; }
        .btn-3d {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white; border: none; border-radius: 16px; padding: 22px 20px;
            font-size: 20px; font-weight: 900; text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            box-shadow: 0 8px 0 #1a5276, 0 12px 15px rgba(0,0,0,0.2);
            cursor: pointer; transition: all 0.1s ease-in-out; width: 100%;
        }
        .btn-3d:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #1a5276, 0 4px 8px rgba(0,0,0,0.2);
        }

        .exercise-list-item {
            background: #f8f9fa; color: var(--primary); padding: 18px; border-radius: 12px;
            margin-bottom: 12px; cursor: pointer; font-weight: bold; font-size: 18px; width: 100%;
            border: 2px solid #e9ecef; transition: 0.2s;
        }
        .exercise-list-item:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .video-wrapper { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);}
        video { width: 100%; display: block; }
        .sound-btn { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold;}
        
        .instructions { background: #f1f8ff; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: start; border-inline-start: 4px solid var(--primary); line-height: 1.6; font-size: 16px;}
        .guidance-box { background: #fff3cd; color: #856404; padding: 12px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; border-inline-start: 4px solid #ffeeba; text-align: start; }

        .counter-box { background: #e8f5e9; border: 2px solid var(--highlight); padding: 25px; border-radius: 15px; margin-bottom: 20px;}
        .count-number { font-size: 45px; font-weight: bold; color: var(--highlight); margin: 10px 0; }
        .count-btn { background: var(--highlight); color: white; border: none; padding: 15px; font-size: 20px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; box-shadow: 0 6px 0 var(--highlight-dark); transition: 0.1s;}
        .count-btn:active { transform: translateY(6px); box-shadow: 0 0 0 var(--highlight-dark); }

        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .back-btn { background: #95a5a6; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; box-shadow: 0 4px 0 #7f8c8d;}
        .back-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #7f8c8d; }
        .home-btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; box-shadow: 0 4px 0 var(--primary-dark);}
        .home-btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--primary-dark); }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">English</button>
    </div>

    <div class="app-container">
        
        <div id="loginScreen" class="screen active">
            <h1 id="loginTitle">مرحباً بك في العلاج المكتبي</h1>
            <p id="loginSub" style="color: #666; font-size: 16px;">الرجاء إدخال اسمك الكريم للبدء:</p>
            <input type="text" id="userNameInput" class="name-input" placeholder="اكتب اسمك هنا...">
            <button class="submit-name-btn" id="startAppBtn" onclick="saveNameAndEnter()">دخول</button>
        </div>

        <div id="welcomeScreen" class="screen">
            <h1 id="welcomeTitle">أهلاً بك</h1>
            <p id="welcomeSub" style="color: #666; font-size: 16px;">اختر القسم الذي ترغب بتمرينه اليوم:</p>
            
            <div class="category-grid">
                <button class="btn-3d" id="btnCat1" onclick="openCategory('neck')">1. تمارين الرقبة والأكتاف</button>
                <button class="btn-3d" id="btnCat2" onclick="openCategory('back')">2. تمارين الظهر والجذع</button>
                <button class="btn-3d" id="btnCat3" onclick="openCategory('legs')">3. تمارين الساقين والحوض</button>
            </div>
        </div>

        <div id="listScreen" class="screen">
            <h2 id="listTitle" style="color: var(--primary); margin-bottom: 25px;">اختر التمرين:</h2>
            <div id="exercisesContainer"></div>
            <button class="back-btn" id="backToWelcomeBtn" onclick="goHome()" style="margin-top: 20px;">🔙 العودة للرئيسية</button>
        </div>

        <div id="videoScreen" class="screen">
            <h2 id="videoTitle" style="color: var(--primary);"></h2>
            
            <div class="video-wrapper">
                <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔇</button>
                <video id="exVideo" autoplay loop muted playsinline>
                    <source id="videoSource" src="" type="video/mp4">
                </video>
            </div>

            <div class="guidance-box" id="guidanceText"></div>
            <div class="instructions" id="videoDesc"></div>

            <div class="counter-box">
                <div id="counterLabel" style="font-weight: bold; color: #333; font-size: 18px;"></div>
                <div class="count-number" id="counterValue">0</div>
                <button class="count-btn" id="addCountBtn" onclick="addCount()"></button>
            </div>

            <div class="btn-group">
                <button class="back-btn" id="backToListBtn" onclick="goToList()"></button>
                <button class="home-btn" id="jumpHomeBtn" onclick="goHome()"></button>
            </div>
        </div>

    </div>

    <script>
        let currentLang = 'ar';
        let currentCategory = '';
        let activeExercise = null;
        let userName = '';
        let count = 0;
        const video = document.getElementById("exVideo");

        const db = {
            neck: [
                { id: 'n1', vid: 'exercise1.mp4', titleAr: '1. تمرين دوران الرقبة', titleEn: '1. Basic Neck Turn', descAr: 'أدر رأسك يميناً ويساراً مع الثبات 10 ثوانٍ.', descEn: 'Turn head side to side, hold for 10 seconds.' },
                { id: 'n2', vid: 'nexkexercise2.mp4', titleAr: '2. إمالة الرقبة', titleEn: '2. Neck Tilt', descAr: 'أمل رأسك نحو كتفك ببطء واثبت.', descEn: 'Tilt head towards shoulder slowly and hold.' }
            ],
            back: [
                { id: 'b1', vid: 'exercise5.mp4', titleAr: '1. تمدد الأكتاف', titleEn: '1. Shoulder Stretch', descAr: 'مد ذراعيك للأمام وادفع ظهرك للخلف.', descEn: 'Stretch arms forward and push back.' }
            ],
            legs: [
                { id: 'l1', vid: 'exercise13.mp4', titleAr: '1. تمدد الحوض', titleEn: '1. Hip Stretch', descAr: 'ضع كاحلك على ركبتك وانحنِ للأمام.', descEn: 'Place ankle on knee and lean forward.' }
            ]
        };

        const trans = {
            ar: {
                langBtn: "English", 
                loginTitle: "مرحباً بك في العلاج المكتبي", loginSub: "الرجاء إدخال اسمك الكريم للبدء:", inputPlaceholder: "اكتب اسمك هنا...", startBtn: "دخول",
                welcomeTitle: "أهلاً بك", welcomeSub: "اختر القسم الذي ترغب بتمرينه اليوم:",
                cat1: "1. تمارين الرقبة والأكتاف", cat2: "2. تمارين الظهر والجذع", cat3: "3. تمارين الساقين والحوض",
                listTitle: "اختر التمرين:", backHome: "🔙 العودة للرئيسية", backList: "🔙 للقائمة", jumpHome: "🏠 للرئيسية",
                countLabel: "عدد التكرارات المنجزة:", countBtn: "+ عدّ تمرين واحد", mute: "🔇 مكتوم", unmute: "🔊 يعمل",
                guidance: "🎯 الهدف: يُنصح بعمل 3 إلى 5 تكرارات لكل جهة لضمان الفائدة.", instructionPrefix: "التعليمات: "
            },
            en: {
                langBtn: "العربية", 
                loginTitle: "Welcome to Office Therapy", loginSub: "Please enter your name to start:", inputPlaceholder: "Type your name here...", startBtn: "Enter",
                welcomeTitle: "Welcome", welcomeSub: "Choose a category to start:",
                cat1: "1. Neck & Shoulders", cat2: "2. Back & Trunk", cat3: "3. Legs & Hips",
                listTitle: "Select Exercise:", backHome: "🔙 Back to Home", backList: "🔙 To List", jumpHome: "🏠 To Home",
                countLabel: "Repetitions completed:", countBtn: "+ Add 1 Rep", mute: "🔇 Muted", unmute: "🔊 Sound On",
                guidance: "🎯 Goal: Recommended 3 to 5 repetitions per side.", instructionPrefix: "Instructions: "
            }
        };

        function saveNameAndEnter() {
            const inputVal = document.getElementById("userNameInput").value.trim();
            if(inputVal === "") {
                alert(currentLang === 'ar' ? "الرجاء إدخال الاسم أولاً" : "Please enter your name first");
                return;
            }
            userName = inputVal;
            
            const scriptURL = 'https://script.google.com/macros/s/AKfycbz2e7ZxNExk7glvDf-wgbsOm7Ou2rF8a-2iyCsWXVmskyM7VpJjvvtgvu49pVo2jYVS/exec';
            if (scriptURL) {
                fetch(scriptURL + '?name=' + encodeURIComponent(userName), {
                    method: 'GET',
                    mode: 'no-cors'
                }).catch(error => console.error('Error!', error.message));
            }
            
            document.getElementById("welcomeTitle").innerText = (currentLang === 'ar' ? "أهلاً بك، " : "Welcome, ") + userName + "!";
            document.getElementById("loginScreen").classList.remove("active");
            document.getElementById("welcomeScreen").classList.add("active");
        }

        function updateUITexts() {
            const t = trans[currentLang];
            
            document.getElementById("langBtn").innerText = t.langBtn;
            
            document.getElementById("loginTitle").innerText = t.loginTitle;
            document.getElementById("loginSub").innerText = t.loginSub;
            document.getElementById("userNameInput").placeholder = t.inputPlaceholder;
            document.getElementById("startAppBtn").innerText = t.startBtn;

            if(userName !== "") {
                document.getElementById("welcomeTitle").innerText = (currentLang === 'ar' ? "أهلاً بك، " : "Welcome, ") + userName + "!";
            } else {
                document.getElementById("welcomeTitle").innerText = t.welcomeTitle;
            }
            document.getElementById("welcomeSub").innerText = t.welcomeSub;
            document.getElementById("btnCat1").innerText = t.cat1;
            document.getElementById("btnCat2").innerText = t.cat2;
            document.getElementById("btnCat3").innerText = t.cat3;
            
            document.getElementById("listTitle").innerText = t.listTitle;
            document.getElementById("backToWelcomeBtn").innerText = t.backHome;
            
            if(currentCategory !== '') {
                const container = document.getElementById("exercisesContainer");
                container.innerHTML = ""; 
                db[currentCategory].forEach(ex => {
                    let btn = document.createElement("button");
                    btn.className = "exercise-list-item";
                    btn.innerText = currentLang === 'ar' ? ex.titleAr : ex.titleEn;
                    btn.onclick = () => openVideo(ex);
                    container.appendChild(btn);
                });
            }

            if(activeExercise) {
                document.getElementById("videoTitle").innerText = currentLang === 'ar' ? activeExercise.titleAr : activeExercise.titleEn;
                document.getElementById("videoDesc").innerHTML = "<strong>" + t.instructionPrefix + "</strong>" + (currentLang === 'ar' ? activeExercise.descAr : activeExercise.descEn);
            }
            document.getElementById("guidanceText").innerText = t.guidance;
            document.getElementById("counterLabel").innerText = t.countLabel;
            document.getElementById("addCountBtn").innerText = t.countBtn;
            document.getElementById("backToListBtn").innerText = t.backList;
            document.getElementById("jumpHomeBtn").innerText = t.jumpHome;
            
            updateSoundBtn();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.getElementById("html-tag").dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById("html-tag").lang = currentLang;
            updateUITexts();
        }

        function openCategory(cat) {
            currentCategory = cat;
            updateUITexts();
            
            document.getElementById("welcomeScreen").classList.remove("active");
            document.getElementById("videoScreen").classList.remove("active");
            document.getElementById("listScreen").classList.add("active");
        }

        function openVideo(ex) {
            activeExercise = ex;
            updateUITexts();
            
            video.src = ex.vid;
            count = 0;
            document.getElementById("counterValue").innerText = count;

            document.getElementById("listScreen").classList.remove("active");
            document.getElementById("videoScreen").classList.add("active");
        }

        function goHome() {
            video.pause();
            activeExercise = null;
            document.getElementById("listScreen").classList.remove("active");
            document.getElementById("videoScreen").classList.remove("active");
            document.getElementById("welcomeScreen").classList.add("active");
        }

        function goToList() {
            video.pause();
            activeExercise = null;
            document.getElementById("videoScreen").classList.remove("active");
            document.getElementById("listScreen").classList.add("active");
        }

        function addCount() {
            count++;
            document.getElementById("counterValue").innerText = count;
        }

        function toggleSound() {
            video.muted = !video.muted;
            updateSoundBtn();
        }

        function updateSoundBtn() {
            document.getElementById("soundBtn").innerText = video.muted ? trans[currentLang].mute : trans[currentLang].unmute;
        }

        updateUITexts();
    </script>
</body>
</html>
