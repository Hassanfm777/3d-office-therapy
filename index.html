<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامج العلاج المكتبي</title>
    
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f9; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
        }
        .exercise-box { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            max-width: 300px; 
            text-align: center; 
        }
        
        /* إعدادات الصورة الأساسية */
        .exercise-img {
            width: 100%;
            border-radius: 8px;
            /* هذا السطر يجعل الحركة ناعمة وليست مفاجئة */
            transition: transform 0.8s ease-in-out; 
            cursor: pointer;
        }

        /* برمجة الحركة التفاعلية عند تمرير الماوس */
        .exercise-img:hover {
            /* الأكواد هنا تجعل الصورة تميل لليمين واليسار */
            animation: neckStretch 2s infinite alternate ease-in-out;
        }

        /* محرك الحركة (يمين ويسار) */
        @keyframes neckStretch {
            0% { transform: rotate(0deg); }
            33% { transform: rotate(15deg); } /* ميل لليمين */
            66% { transform: rotate(0deg); }
            100% { transform: rotate(-15deg); } /* ميل لليسار */
        }

        .instructions { 
            background: #eef7fc; 
            padding: 15px; 
            border-radius: 8px; 
            margin-top: 15px; 
            text-align: right; 
            border-right: 4px solid #2c5e7b; 
        }
    </style>
</head>
<body>

    <h1>برنامج العلاج المكتبي اليومي</h1>

    <div class="exercise-box">
        <h2>1. تمرين دوران الرقبة</h2>
        <p style="font-size: 12px; color: #666;">(مرر الماوس فوق الصورة لترى الحركة)</p>
        
        <!-- يجب أن تقوم بقص صورة التمرين الأول من صورتك وتسميتها exercise1.jpg ورفعها لـ GitHub -->
        <img src="exercise1.jpg" alt="تمرين دوران الرقبة" class="exercise-img">

        <div class="instructions">
            <strong>طريقة التمرين:</strong> أدر رأسك ببطء يميناً ويساراً مع الثبات لمدة 10 ثوانٍ.
        </div>
    </div>

</body>
</html>
