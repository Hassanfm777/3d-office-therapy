<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامج العلاج المكتبي</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .exercise-box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 300px; text-align: center; }
        .instructions { background: #eef7fc; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: right; border-right: 4px solid #2c5e7b; }
        /* إعدادات الفيديو ليكون متناسقاً مع الصندوق */
        video { width: 100%; border-radius: 8px; outline: none; pointer-events: none; }
    </style>
</head>
<body>

    <h1>برنامج العلاج المكتبي اليومي</h1>

    <div class="exercise-box">
        <h2>1. تمرين دوران الرقبة</h2>
        
        <!-- هذا الكود يبحث عن فيديو باسم exercise1.mp4 ليعرضه -->
        <video autoplay loop muted playsinline>
            <source src="exercise1.mp4" type="video/mp4">
            متصفحك لا يدعم تشغيل الفيديو.
        </video>

        <div class="instructions">
            <strong>طريقة التمرين:</strong> أدر رأسك ببطء يميناً ويساراً مع الثبات لمدة 10 ثوانٍ.
        </div>
    </div>

</body>
</html>
