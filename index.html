<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Therapy | العلاج المكتبي</title>
    <style>
        :root {
            --primary: #2c5e7b;
            --secondary: #34495e;
            --bg-color: #f8f9fa;
            --box-bg: #ffffff;
            --text-dark: #2d3436;
            --highlight: #27ae60;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            color: var(--text-dark);
            margin: 0;
        }

        .top-bar {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .lang-btn {
            background-color: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 5px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .lang-btn:hover { background-color: var(--primary); color: white; }

        .app-container { 
            background: var(--box-bg); 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            max-width: 500px; 
            width: 100%;
            box-sizing: border-box;
        }
        
        h1 { text-align: center; color: var(--primary); font-size: 24px; margin-top: 0; margin-bottom: 25px; }

        /* تنسيق الأزرار في الصفحة الرئيسية */
        .category-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        
        .cat-btn {
            background-color: #f1f2f6;
            border: 2px solid #dfe6e9;
            color: var(--secondary);
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-btn:hover { border-color: var(--primary); background-color: #eef7fc; }

        /* تنسيق صفحة التمرين */
        .video-wrapper { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background-color: #000; margin-bottom: 15px; }
        video { width: 100%; display: block; }
        .sound-btn { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6); color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; z-index: 10; }
        
        .instructions { background: #f1f8ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-inline-start: 4px solid var(--primary); line-height: 1.6; }

        /* تنسيق العداد */
        .counter-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }
        .count-btn { background: var(--highlight); color: white; border: none; padding: 10px 25px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .count-btn:active { transform: scale(0.95); }
        .count-display { font-size: 24px; font-weight: bold; color: var(--secondary); }

        .back-btn { background: #95a5a6; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 20px;}
        
        /* التحكم في إظهار وإخفاء الصفحات */
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">English</button>
    </div>

    <div class="app-container">
        
        <!-- الصفحة الرئيسية (اختيار التمرين) -->
        <div id="homePage" class="page active">
            <h1 id="mainTitle">برنامج العلاج المكتبي اليومي</h1>
            <p id="subTitle" style="text-align: center; color: #666; margin-bottom: 20px;">اختر فئة التمرين للبدء:</p>
            
            <div class="category-grid">
                <button class="cat-btn" id="btn-neck" onclick="openExercise('neck')">الرقبة والأكتاف</button>
                <button class="cat-btn" id="btn-upper" onclick="openExercise('upper')">الجزء العلوي والجذع</button>
                <button class="cat-btn" id="btn-lower" onclick="openExercise('lower')">أسفل الظهر والجوانب</button>
                <button class="cat-btn" id="btn-legs" onclick="openExercise('legs')">الساقين والحوض</button>
            </div>
        </div>

        <!-- صفحة التمرين (الفيديو والعداد) -->
        <div id="exercisePage" class="page">
            <h1 id="exerciseTitle">عنوان التمرين</h1>
            
            <div class="video-wrapper">
                <button class="sound-btn" id="soundToggleBtn" onclick="toggleSound()">🔇 كتم الصوت</button>
                <video id="exerciseVideo" autoplay loop muted playsinline>
                    <source src="" type="video/mp4">
                </video>
            </div>

            <div class="instructions" id="exerciseDesc">تعليمات التمرين هنا</div>

            <!-- قسم العداد -->
            <div class="counter-section">
                <button class="count-btn" id="addCountBtn" onclick="incrementCounter()">+ عدّ التمرين</button>
                <div class="count-display"><span id="countText">التكرارات:</span> <span id="counterValue">0</span></div>
            </div>

            <button class="back-btn" id="backBtn" onclick="goBack()">🔙 العودة للقائمة الرئيسية</button>
        </div>

    </div>

    <script>
        // المتغيرات
        let currentLang = 'ar';
        let currentRepCount = 0;
        const video = document.getElementById("exerciseVideo");

        // القاموس الشامل للغتين
        const translations = {
            ar: {
                langBtn: "English",
                mainTitle: "برنامج العلاج المكتبي اليومي",
                subTitle: "اختر فئة التمرين للبدء:",
                btnNeck: "الرقبة والأكتاف",
                btnUpper: "الجزء العلوي والجذع",
                btnLower: "أسفل الظهر والجوانب",
                btnLegs: "الساقين والحوض",
                addCount: "+ عدّ التمرين",
                countText: "التكرارات:",
                backBtn: "🔙 العودة للقائمة",
                mute: "🔇 مكتوم",
                unmute: "🔊 الصوت يعمل",
                exercises: {
                    neck: { title: "1. تمرين دوران الرقبة", desc: "<strong>طريقة التمرين:</strong> أدر رأسك ببطء يميناً ويساراً مع الثبات لمدة 10 ثوانٍ لكل جهة." },
                    upper: { title: "5. تمدد الأكتاف وأعلى الظهر", desc: "<strong>طريقة التمرين:</strong> مد ذراعيك للأمام واشبك أصابعك، ثم ادفع ظهرك للخلف ببطء." },
                    lower: { title: "9. إطالة أسفل الظهر", desc: "<strong>طريقة التمرين:</strong> انحنِ للأمام من كرسيك ببطء وحاول الوصول بيديك إلى الأرض." },
                    legs: { title: "13. تمدد الحوض والساقين", desc: "<strong>طريقة التمرين:</strong> ضع كاحل قدمك على ركبة القدم الأخرى وانحنِ للأمام بلطف." }
                }
            },
            en: {
                langBtn: "العربية",
                mainTitle: "Daily Office Therapy",
                subTitle: "Select an exercise category to start:",
                btnNeck: "Neck & Shoulders",
                btnUpper: "Upper Body & Trunk",
                btnLower: "Lower Back & Sides",
                btnLegs: "Legs & Hips",
                addCount: "+ Add Rep",
                countText: "Reps:",
                backBtn: "🔙 Back to Menu",
                mute: "🔇 Muted",
                unmute: "🔊 Sound On",
                exercises: {
                    neck: { title: "1. Basic Neck Turn", desc: "<strong>Instructions:</strong> Slowly turn your head side to side, holding for 10 seconds each." },
                    upper: { title: "5. Shoulder & Upper Back Stretch", desc: "<strong>Instructions:</strong> Stretch arms forward, interlock fingers, and push your back outward." },
                    lower: { title: "9. Glutes & Lower Back", desc: "<strong>Instructions:</strong> Slowly bend forward from your chair and reach towards the floor." },
                    legs: { title: "13. Hip Stretch", desc: "<strong>Instructions:</strong> Place one ankle on the opposite knee and gently lean forward." }
                }
            }
        };

        // دالة تبديل اللغة
        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.getElementById("html-tag").dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById("html-tag").lang = currentLang;
            
            const t = translations[currentLang];
            
            // تحديث نصوص الصفحة الرئيسية
            document.getElementById("langBtn").innerText = t.langBtn;
            document.getElementById("mainTitle").innerText = t.mainTitle;
            document.getElementById("subTitle").innerText = t.subTitle;
            document.getElementById("btn-neck").innerText = t.btnNeck;
            document.getElementById("btn-upper").innerText = t.btnUpper;
            document.getElementById("btn-lower").innerText = t.btnLower;
            document.getElementById("btn-legs").innerText = t.btnLegs;
            
            // تحديث نصوص العداد والرجوع
            document.getElementById("addCountBtn").innerText = t.addCount;
            document.getElementById("countText").innerText = t.countText;
            document.getElementById("backBtn").innerText = t.backBtn;
            
            updateSoundBtnText();

            // تحديث عنوان وتعليمات التمرين إذا كان المستخدم داخل صفحة التمرين
            const activeExercise = video.getAttribute("data-current-category");
            if (activeExercise) {
                document.getElementById("exerciseTitle").innerText = t.exercises[activeExercise].title;
                document.getElementById("exerciseDesc").innerHTML = t.exercises[activeExercise].desc;
            }
        }

        // دالة فتح صفحة التمرين
        function openExercise(category) {
            const t = translations[currentLang].exercises[category];
            
            document.getElementById("exerciseTitle").innerText = t.title;
            document.getElementById("exerciseDesc").innerHTML = t.desc;
            video.setAttribute("data-current-category", category);

            if(category === "neck") video.src = "exercise1.mp4";
            else if(category === "upper") video.src = "exercise5.mp4";
            else if(category === "lower") video.src = "exercise9.mp4";
            else if(category === "legs") video.src = "exercise13.mp4";
            
            // تصفير العداد عند الدخول لتمرين جديد
            currentRepCount = 0;
            document.getElementById("counterValue").innerText = currentRepCount;

            // إخفاء الرئيسية وإظهار التمرين
            document.getElementById("homePage").classList.remove("active");
            document.getElementById("exercisePage").classList.add("active");
        }

        // دالة الرجوع للصفحة الرئيسية
        function goBack() {
            video.pause(); // إيقاف الفيديو لتوفير الموارد
            document.getElementById("exercisePage").classList.remove("active");
            document.getElementById("homePage").classList.add("active");
        }

        // دالة العداد
        function incrementCounter() {
            currentRepCount++;
            document.getElementById("counterValue").innerText = currentRepCount;
        }

        // دالة الصوت
        function toggleSound() {
            video.muted = !video.muted;
            updateSoundBtnText();
        }
        function updateSoundBtnText() {
            document.getElementById("soundToggleBtn").innerText = video.muted ? translations[currentLang].mute : translations[currentLang].unmute;
        }
    </script>
</body>
</html>
