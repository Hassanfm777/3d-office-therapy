<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامج العلاج المكتبي</title>
    
    <!-- هذه هي الأداة السحرية لتشغيل الـ 3D بسهولة -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        .exercise-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        /* إعدادات صندوق الـ 3D */
        model-viewer {
            width: 100%;
            height: 350px;
            background-color: #dbeaf0;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>برنامج العلاج المكتبي اليومي</h1>

    <div class="exercise-box">
        <h2>1. تمرين دوران الرقبة</h2>
        <p>هذا مجسم تجريبي. يمكنك تحريكه بالماوس!</p>
        
        <!-- هنا يتم عرض المجسم المتحرك -->
        <model-viewer 
            src="https://modelviewer.dev/shared-assets/models/RobotExpressive.glb" 
            alt="مجسم 3D للتمرين" 
            auto-rotate 
            camera-controls 
            autoplay 
            animation-name="Dance">
        </model-viewer>
    </div>

</body>
</html>
