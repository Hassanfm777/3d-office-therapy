<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Therapy</title>
    <style>
        :root {
            --primary: #2c5e7b;
            --secondary: #34495e;
            --bg-color: #f4f7f6;
            --box-bg: #ffffff;
            --highlight: #27ae60;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            color: #333;
            margin: 0;
        }

        /* زر تغيير اللغة */
        .top-bar { width: 100%; max-width: 500px; display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .lang-btn { background: transparent; border: 2px solid var(--primary); color: var(--primary); padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .lang-btn:hover { background: var(--primary); color: white; }

        .app-container { 
            background: var(--box-bg); 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.1); 
            max-width: 500px; 
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        /* التحكم بالصفحات (إخفاء وإظهار) */
        .screen { display: none; }
        .screen.active { display: block; }

        /* تنسيق الأزرار الرئيسية */
        h1 { color: var(--primary); margin-top: 0; }
        .main-btn {
            background-color: #f1f2f6; border: 2px solid #dfe6e9; color: var(--secondary);
            padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold;
            cursor: pointer; width: 100%; margin-bottom: 15px; transition: 0.3s;
        }
        .main-btn:hover { border-color: var(--primary); background-color: #eef7fc; }

        /* تنسيق قائمة التمارين */
        .exercise-list-item {
            background: var(--primary); color: white; padding: 15px; border-radius: 8px;
            margin-bottom: 10px; cursor: pointer; font-weight: bold; border: none; width: 100%;
        }

        /* تنسيق الفيديو */
        .video-wrapper { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 15px; }
        video { width: 100%; display: block; }
        .sound-btn { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
        
        .instructions { background: #f1f8ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: right; border-inline-start: 4px solid var(--primary); }

        /* تنسيق العداد الكبير */
        .counter-box { background: #e8f5e9; border: 2px solid var(--highlight); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .count-number { font-size: 40px; font-weight: bold; color: var(--highlight); margin: 10px 0; }
        .count-btn { background: var(--highlight); color: white; border: none; padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; }
        .count-btn:active { transform: scale(0.95); }

        .back-btn { background: #95a5a6; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px;}
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">English</button>
    </div>

    <div class="app-container">
        
        <!-- الشاشة الأولى: صفحة الترحيب (3 خيارات) -->
        <div id="welcomeScreen" class="screen active">
            <h1 id="welcomeTitle">أهلاً بك في برنامج العلاج المكتبي</h1>
            <p id="welcomeSub" style="color: #666; margin-bottom: 25px;">اختر القسم الذي ترغب بتمرينه اليوم:</p>
            
            <button class="main-btn" id="btnCat1" onclick="openCategory('neck')">1. تمارين الرقبة والأكتاف</button>
            <button class="main-btn" id="btnCat2" onclick="openCategory('back')">2. تمارين الظهر والجذع</button>
            <button class="main-btn" id="btnCat3" onclick="openCategory('legs')">3. تمارين الساقين والحوض</button>
        </div>

        <!-- الشاشة الثانية: قائمة التمارين للقسم المختار -->
        <div id="listScreen" class="screen">
            <h2 id="listTitle" style="color: var(--primary);">اختر التمرين</h2>
            <div id="exercisesContainer">
                <!-- سيتم تعبئة الأزرار هنا برمجياً بناء على القسم -->
            </div>
            <button class="back-btn" id="backToWelcomeBtn" onclick="goHome()">🔙 العودة للرئيسية</button>
        </div>

        <!-- الشاشة الثالثة: صفحة الفيديو والعداد -->
        <div id="videoScreen" class="screen">
            <h2 id="videoTitle">عنوان التمرين</h2>
            
            <div class="video-wrapper">
                <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔇 مكتوم</button>
                <video id="exVideo" autoplay loop muted playsinline>
                    <source id="videoSource" src="" type="video/mp4">
                </video>
            </div>

            <div class="instructions" id="videoDesc" style="text-align: inherit;">تعليمات التمرين</div>

            <!-- العداد الواضح -->
            <div class="counter-box">
                <div id="counterLabel" style="font-weight: bold; color: #333;">عدد التكرارات التي قمت بها:</div>
                <div class="count-number" id="counterValue">0</div>
                <button class="count-btn" id="addCountBtn" onclick="addCount()">+ عدّ تمرين واحد</button>
            </div>

            <button class="back-btn" id="backToListBtn" onclick="goToList()">🔙 العودة للقائمة</button>
        </div>

    </div>

    <script>
        let currentLang = 'ar';
        let currentCategory = '';
        let count = 0;
        const video = document.getElementById("exVideo");

        // قاعدة بيانات التمارين (هنا أضفت الفيديو الثاني للرقبة بالاسم الذي طلبته)
        const db = {
            neck: [
                { id: 'n1', vid: 'exercise1.mp4', titleAr: '1. تمرين دوران الرقبة', titleEn: '1. Basic Neck Turn', descAr: 'أدر رأسك يميناً ويساراً مع الثبات 10 ثوانٍ.', descEn: 'Turn head side to side, hold 10 seconds.' },
                { id: 'n2', vid: 'nexkexercise2.mp4', titleAr: '2. إمالة الرقبة', titleEn: '2. Neck Tilt', descAr: 'أمل رأسك نحو كتفك ببطء واثبت.', descEn: 'Tilt head towards shoulder and hold.' }
            ],
            back: [
                { id: 'b1', vid: 'exercise5.mp4', titleAr: '1. تمدد الأكتاف', titleEn: '1. Shoulder Stretch', descAr: 'مد ذراعيك للأمام وادفع ظهرك للخلف.', descEn: 'Stretch arms forward and push back.' }
            ],
            legs: [
                { id: 'l1', vid: 'exercise13.mp4', titleAr: '1. تمدد الحوض', titleEn: '1. Hip Stretch', descAr: 'ضع كاحلك على ركبتك وانحنِ للأمام.', descEn: 'Place ankle on knee and lean forward.' }
            ]
        };

        // قاموس النصوص الأساسية
        const trans = {
            ar: {
                lang: "English", welcomeTitle: "أهلاً بك في برنامج العلاج المكتبي", welcomeSub: "اختر القسم الذي ترغب بتمرينه اليوم:",
                cat1: "1. تمارين الرقبة والأكتاف", cat2: "2. تمارين الظهر والجذع", cat3: "3. تمارين الساقين والحوض",
                listTitle: "اختر التمرين:", backHome: "🔙 العودة للرئيسية", backList: "🔙 العودة للقائمة",
                countLabel: "عدد التكرارات التي قمت بها:", countBtn: "+ عدّ تمرين واحد", mute: "🔇 مكتوم", unmute: "🔊 يعمل"
            },
            en: {
                lang: "العربية", welcomeTitle: "Welcome to Office Therapy", welcomeSub: "Choose a category to start:",
                cat1: "1. Neck & Shoulders", cat2: "2. Back & Trunk", cat3: "3. Legs & Hips",
                listTitle: "Select Exercise:", backHome: "🔙 Back to Home", backList: "🔙 Back to List",
                countLabel: "Repetitions completed:", countBtn: "+ Add 1 Rep", mute: "🔇 Muted", unmute: "🔊 On"
            }
        };

        // دالة تبديل اللغة
        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.getElementById("html-tag").dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById("html-tag").lang = currentLang;
            
            const t = trans[currentLang];
            document.getElementById("langBtn").innerText = t.lang;
            document.getElementById("welcomeTitle").innerText = t.welcomeTitle;
            document.getElementById("welcomeSub").innerText = t.welcomeSub;
            document.getElementById("btnCat1").innerText = t.cat1;
            document.getElementById("btnCat2").innerText = t.cat2;
            document.getElementById("btnCat3").innerText = t.cat3;
            document.getElementById("listTitle").innerText = t.listTitle;
            document.getElementById("backToWelcomeBtn").innerText = t.backHome;
            document.getElementById("backToListBtn").innerText = t.backList;
            document.getElementById("counterLabel").innerText = t.countLabel;
            document.getElementById("addCountBtn").innerText = t.countBtn;
            
            updateSoundBtn();
            
            // تحديث القائمة المعروضة حالياً إن وجدت
            if(document.getElementById("listScreen").classList.contains("active")) {
                openCategory(currentCategory); 
            }
        }

        // فتح الشاشة الثانية (قائمة التمارين)
        function openCategory(cat) {
            currentCategory = cat;
            const container = document.getElementById("exercisesContainer");
            container.innerHTML = ""; // مسح الأزرار القديمة
            
            // إنشاء أزرار التمارين برمجياً
            db[cat].forEach(ex => {
                let btn = document.createElement("button");
                btn.className = "exercise-list-item";
                btn.innerText = currentLang === 'ar' ? ex.titleAr : ex.titleEn;
                btn.onclick = () => openVideo(ex);
                container.appendChild(btn);
            });

            document.getElementById("welcomeScreen").classList.remove("active");
            document.getElementById("videoScreen").classList.remove("active");
            document.getElementById("listScreen").classList.add("active");
        }

        // فتح الشاشة الثالثة (الفيديو والعداد)
        function openVideo(ex) {
            document.getElementById("videoTitle").innerText = currentLang === 'ar' ? ex.titleAr : ex.titleEn;
            document.getElementById("videoDesc").innerHTML = "<strong>" + (currentLang === 'ar' ? "التعليمات: " : "Instructions: ") + "</strong>" + (currentLang === 'ar' ? ex.descAr : ex.descEn);
            
            video.src = ex.vid;
            
            // تصفير العداد للتمرين الجديد
            count = 0;
            document.getElementById("counterValue").innerText = count;

            document.getElementById("listScreen").classList.remove("active");
            document.getElementById("videoScreen").classList.add("active");
        }

        // دوال التنقل والعداد والصوت
        function goHome() {
            document.getElementById("listScreen").classList.remove("active");
            document.getElementById("welcomeScreen").classList.add("active");
        }
        function goToList() {
            video.pause();
            document.getElementById("videoScreen").classList.remove("active");
            document.getElementById("listScreen").classList.add("active");
        }
        function addCount() {
            count++;
            document.getElementById("counterValue").innerText = count;
        }
        function toggleSound() {
            video.muted = !video.muted;
            updateSoundBtn();
        }
        function updateSoundBtn() {
            document.getElementById("soundBtn").innerText = video.muted ? trans[currentLang].mute : trans[currentLang].unmute;
        }
    </script>
</body>
</html>
